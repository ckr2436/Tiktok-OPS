model:
  default: video-analyst-gpt-5.4-mini
  provider: custom:gmv_gateway
  base_url: http://127.0.0.1:8650/v1
  api_mode: chat_completions
  max_tokens: 4000
  reasoning_effort: low
providers:
  gmv_gateway:
    name: GMV AI Gateway
    base_url: http://127.0.0.1:8650/v1
    key_env: GMV_AI_GATEWAY_KEY
    transport: chat_completions
    default_model: video-analyst-gpt-5.4-mini
    models:
      video-analyst-gpt-5.4-mini: {}
fallback_providers: []
platform_toolsets:
  cli: []
  api_server: []
platforms:
  api_server:
    extra:
      host: 127.0.0.1
      port: 8647
      model_name: gmv-ops-hermes-video-analyst
agent:
  max_turns: 1
  gateway_timeout: 180
  api_max_retries: 1
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ''
skills:
  guard_agent_created: true
  disabled: []
curator:
  enabled: false
