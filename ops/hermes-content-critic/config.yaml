model:
  default: gmv-content-critic-v1
  provider: custom:gmv_ai_gateway
  base_url: http://127.0.0.1:8650/v1
  api_mode: chat_completions
  max_tokens: 16384
providers:
  gmv_ai_gateway:
    name: GMV AI Gateway
    base_url: http://127.0.0.1:8650/v1
    key_env: GMV_AI_GATEWAY_KEY
    transport: chat_completions
    default_model: gmv-content-critic-v1
    models:
      gmv-content-critic-v1: {}
# Provider/account failover is owned by the local routing gateway. Hermes
# stays stateless and never embeds a second provider credential or policy.
fallback_providers: []
platform_toolsets:
  cli: []
  api_server: []
platforms:
  api_server:
    extra:
      host: 127.0.0.1
      port: 8646
      model_name: gmv-ops-hermes-content-critic
agent:
  max_turns: 2
  gateway_timeout: 300
  api_max_retries: 2
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ''
skills:
  guard_agent_created: true
  disabled: []
curator:
  enabled: false
